title: woodtalk's 잡지식
description: ""
email: woodtalk@daum.net
lang: ko-KR
baseurl: ""
url: "https://woodtalk.github.io"
github_username: woodtalk

theme: jekyll-theme-minimal
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-relative-links
  - jekyll-seo-tag

collections:
  wiki:
    output: true
    permalink: /:collection/:path/

relative_links:
  enabled: true
  collections: true
  exclude:
    - index.html

defaults:
  - scope:
      path: ""
      type: wiki
    values:
      layout: wiki

utterances:
  repo: woodtalk/woodtalk.github.io
  issue-term: pathname
  label: Comment
  theme: github-light
