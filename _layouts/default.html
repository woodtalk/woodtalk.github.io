<!doctype html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
    <script src="{{ '/assets/js/code-blocks.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
        <nav class="site-nav" aria-label="주 메뉴">
          <a href="{{ '/wiki/' | relative_url }}">글 목록</a>
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
          <a href="https://github.com/{{ site.github_username | escape }}">GitHub</a>
        </nav>
      </header>
      <main class="page-content" id="main-content" tabindex="-1">
        {{ content }}
      </main>
      <footer class="site-footer">
        <span>by <a href="https://github.com/{{ site.github_username | escape }}">{{ site.github_username | escape }}</a></span>
        <span>Powered by <a href="https://jekyllrb.com/">Jekyll</a> · <a href="https://pages.github.com/">GitHub Pages</a></span>
      </footer>
    </div>
  </body>
</html>
